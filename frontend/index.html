<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifras y Letras - Solo Mode</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <div id="game-container">
        <header>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem;">
                <h1 style="margin: 0;">Cifras y Letras</h1>
                <button id="start-game-btn">Empezar / Reiniciar</button>
                <button id="pause-btn">Pausa</button>
            </div>
            <div class="stats">
                <div class="stat-box">
                    <span class="label">Puntos</span>
                    <span id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Power Points</span>
                    <span id="power-points">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">Tiempo</span>
                    <span id="timer">00:00</span>
                </div>
            </div>
        </header>

        <main>
            <div id="round-info">
                <h2 id="round-title">Bienvenido!</h2>
                <p id="round-description">Presiona "Empezar" para comenzar.</p>
            </div>

            <div id="game-display">
                <div id="content-area"></div>

                <!-- New containers for the interactive Number Round -->
                <div id="number-interaction-ui" style="display: none;">
                    <div id="operator-selector" class="operator-group">
                        <button class="op-btn" data-op="+">+</button>
                        <button class="op-btn" data-op="-">-</button>
                        <button class="op-btn" data-op="*">×</button>
                        <button class="op-btn" data-op="/">÷</button>
                    </div>
                    <button id="add-calc-btn">Añadir</button>
                    <button id="remove-calc-btn">Borrar último</button>
                    <div id="calc-history"></div>
                </div>

                <div class="controls hidden" id="controls-container">
                    <div class="input-group">
                        <input type="text" id="user-input" placeholder="Tu respuesta..." disabled>
                        <button id="action-btn" disabled>Enviar</button>
                    </div>                    
                    <div id="input-hint" class="hint"></div>
                </div>
            </div>
        </main>

        <footer style="margin-top: 2rem; font-size: 0.7rem; color: #999;">
            Cifras y Letras - Solo Mode Engine
        </footer>
    </div>
</body>
</html>
